<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sudoku Online</title>
    <link rel="icon" href="icon.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f9f9f9;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .logo {
            width: 120px;
            height: 120px;
            border-radius: 28px;
            margin-bottom: 24px;
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            color: #111;
            margin-bottom: 6px;
            letter-spacing: -0.5px;
        }

        .sub {
            font-size: 15px;
            color: #888;
            margin-bottom: 36px;
        }

        .download-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: #1a73e8;
            color: white;
            text-decoration: none;
            padding: 14px 32px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            transition: background 0.15s;
            margin-bottom: 12px;
        }

        .download-btn:hover {
            background: #1558b0;
        }

        .download-btn svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        .version {
            font-size: 13px;
            color: #aaa;
            margin-bottom: 40px;
        }

        .note {
            font-size: 13px;
            color: #999;
            text-align: center;
            max-width: 280px;
            line-height: 1.6;
            margin-bottom: 48px;
        }

        footer {
            font-size: 12px;
            color: #ccc;
        }

        footer a {
            color: #aaa;
            text-decoration: none;
        }

        footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <img src="icon.png" alt="Sudoku Online" class="logo">
    <h1>Sudoku Online</h1>
    <p class="sub">Spielen, lernen, gewinnen.</p>

    <a href="sudoku-online.apk" class="download-btn">
        <svg viewBox="0 0 24 24"><path d="M5 20h14v-2H5v2zm7-18L5.33 9h3.67v6h4V9h3.67L12 2z"/></svg>
        APK herunterladen
    </a>
    <p class="version">Version 1.4.0 &nbsp;&middot;&nbsp; Android 8.0+</p>

    <p class="note">
        Einstellungen &rsaquo; Sicherheit &rsaquo;<br>
        &bdquo;Unbekannte Quellen&ldquo; aktivieren,<br>
        dann APK öffnen und installieren.
    </p>

    <footer>
        <a href="privacy.html">Datenschutz</a>
    </footer>
</body>
</html>
